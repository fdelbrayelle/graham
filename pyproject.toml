[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graham-agent"
version = "0.1.0"
description = "Fullscreen TUI stock screener inspired by Benjamin Graham"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "graham"}
]
dependencies = [
  "textual>=0.58.0",
  "rich>=13.7.0",
  "yfinance>=0.2.40",
  "litellm>=1.60.0",
  "typer>=0.12.0",
  "deep-translator>=1.11.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[project.scripts]
graham = "graham_agent.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["graham_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
